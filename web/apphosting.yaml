# Firebase App Hosting – Geofence Next.js app
# Set app root to "web" when creating the backend if repo root is parent.
# https://firebase.google.com/docs/app-hosting/configure
#
# Database (Supabase): set in Firebase Console → App Hosting → Environment
#   DATABASE_URL
#   CELGPS_DATABASE_URL
#   CELGPS_DB_TARGET=supabase
#   CELGPS_SUPABASE_PASSWORD (optional if URLs are set)
# Do NOT also bind those from Secret Manager here — avoids two conflicting sources.
# TrackSolid remains Secret Manager (already working in prod).

runConfig:
  cpu: 1
  memoryMiB: 512

env:
  # Safety net if Console env is missing; Console values override yaml when both exist.
  - variable: CELGPS_DB_TARGET
    value: "supabase"
    availability: [RUNTIME]
  # TrackSolid API. Set via: firebase apphosting:secrets:set TRACKSOLID_*
  - variable: TRACKSOLID_APP_KEY
    secret: TRACKSOLID_APP_KEY
    availability: [RUNTIME]
  - variable: TRACKSOLID_APP_SECRET
    secret: TRACKSOLID_APP_SECRET
    availability: [RUNTIME]
  - variable: TRACKSOLID_ACCOUNT
    secret: TRACKSOLID_ACCOUNT
    availability: [RUNTIME]
  - variable: TRACKSOLID_PASSWORD_MD5
    secret: TRACKSOLID_PASSWORD_MD5
    availability: [RUNTIME]
